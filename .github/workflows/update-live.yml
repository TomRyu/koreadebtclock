# =============================================================
# data/live.js 를 매일 갱신한다.
#
# 이 사이트는 빌드 도구도 서버도 없는 정적 사이트다. 그 성질을 지키면서
# 값을 최신으로 유지하는 방법이 이것이다 — 봇이 파일을 커밋하고,
# 브라우저는 평소처럼 <script> 로 읽는다. file:// 에서도 그대로 돌아간다.
#
# 실패해도 사이트는 멀쩡하다. 씨앗값이 남을 뿐이고, 환율 기준일이
# 45일을 넘기면 원화 외 통화를 볼 때 상단 배너가 스스로 알린다.
# =============================================================
name: update-live

on:
  schedule:
    - cron: '20 22 * * *'      # UTC 22:20 = KST 07:20 (장 열리기 전)
  workflow_dispatch:            # Actions 탭에서 손으로도 돌릴 수 있다

permissions:
  contents: write

concurrency:
  group: update-live
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'    # 전역 fetch 가 필요하다 (18+)

      - name: 환율 · 시장금리 갱신
        env:
          # 저장소 Settings → Secrets and variables → Actions 에 등록.
          # 없으면 환율만 갱신하고 금리는 조용히 건너뜁니다.
          ECOS_API_KEY: ${{ secrets.ECOS_API_KEY }}
        run: node scripts/update-live.js

      - name: 문법 검사
        run: node --check data/live.js

      - name: 바뀌었으면 커밋
        run: |
          if [ -z "$(git status --porcelain data/live.js)" ]; then
            echo "바뀐 값 없음 — 커밋하지 않습니다."
            exit 0
          fi
          git config user.name  "koreadebtclock-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/live.js
          git commit -m "chore(live): 자동 갱신 $(TZ=Asia/Seoul date +%Y-%m-%d)"
          git push
